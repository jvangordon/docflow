<!doctype html><html><head><meta charset="utf-8"><title>DocFlow</title><style>html,body{margin:0;padding:0;background:#0E1114}</style></head><body><div id="root">
<header class="mast">
  <div class="wordmark"><span class="mk"></span>DocFlow</div>
  <nav>
    <button data-go="start" class="on">Start</button>
    <button data-go="docs">Documents</button>
    <button data-go="flow">Flow</button>
    <button data-go="ask">Ask</button>
    <button data-go="uc1">Claims</button>
    <button data-go="uc2">Suppliers</button>
    <button data-go="built">Built</button>
  </nav>
  <div class="mast-right">
    <span class="ws">Acme Manufacturing</span>
    <span class="mock">MOCK</span>
  </div>
</header>
<main id="stage"></main>
</div>

<style>
:root{
  --bg:#0E1114; --bg2:#111519; --surf:#14181D; --raise:#1A1F26; --inset:#0B0E11;
  --ink:#F2F0EC; --ink2:#C7CBD1; --dim:#9BA3AD; --faint:#5C6670; --ghost:#343B44;
  --hair:rgba(242,240,236,.07); --hair2:rgba(242,240,236,.14);
  --lava:#FF3B20; --lava2:#FF7A45;
  --ie:#4ADE97; --ka:#B49BF6; --sec:#5CA8E8; --arch:#8A939E; --warn:#F5A524;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
#root{min-height:100vh;background:
  radial-gradient(1200px 500px at 80% -180px, rgba(255,59,32,.05), transparent 60%),
  var(--bg);
  color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}

/* ------- masthead ------- */
.mast{display:flex;align-items:center;gap:34px;height:58px;padding:0 clamp(20px,4vw,48px);
  border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(14,17,20,.86);
  backdrop-filter:blur(10px);z-index:10}
.wordmark{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.mk{width:11px;height:11px;border-radius:2.5px;background:linear-gradient(135deg,var(--lava),var(--lava2));
  box-shadow:0 0 16px rgba(255,59,32,.45)}
.mast nav{display:flex;gap:4px;height:100%}
.mast nav button{background:none;border:0;color:var(--faint);font:500 13.5px var(--sans);
  padding:0 13px;cursor:pointer;position:relative;height:100%;letter-spacing:.01em}
.mast nav button:hover{color:var(--ink2)}
.mast nav button.on{color:var(--ink)}
.mast nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--lava),var(--lava2));border-radius:2px}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws{font-size:12.5px;color:var(--dim)}
.mock{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--warn);
  border:1px solid rgba(245,165,36,.45);padding:3px 7px;border-radius:4px}

/* ------- page scaffold ------- */
main{max-width:1140px;margin:0 auto;padding:52px clamp(20px,4vw,48px) 96px}
.over{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.08;
  margin:10px 0 10px;text-wrap:balance}
.dek{color:var(--dim);font-size:15px;max-width:66ch;line-height:1.65}
.rule{height:1px;background:var(--hair);margin:36px 0}
.sect{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin:44px 0 18px;display:flex;align-items:center;gap:14px}
.sect::after{content:"";flex:1;height:1px;background:var(--hair)}

/* ------- primitives ------- */
.tag{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.04em;
  padding:2.5px 8px;border-radius:100px;border:1px solid var(--hair2);color:var(--dim)}
.tag .d{width:5px;height:5px;border-radius:50%}
.tag.ie{color:var(--ie);border-color:rgba(74,222,151,.3)} .tag.ie .d{background:var(--ie)}
.tag.ka{color:var(--ka);border-color:rgba(180,155,246,.32)} .tag.ka .d{background:var(--ka)}
.tag.sec{color:var(--sec);border-color:rgba(92,168,232,.32)} .tag.sec .d{background:var(--sec)}
.tag.warn{color:var(--warn);border-color:rgba(245,165,36,.34)} .tag.warn .d{background:var(--warn)}
.tag.mut{color:var(--faint)} .tag.mut .d{background:var(--ghost)}
.btn{font:600 13px var(--sans);letter-spacing:.01em;padding:9px 18px;border-radius:8px;
  border:1px solid var(--hair2);background:transparent;color:var(--ink2);cursor:pointer;
  transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--dim);color:var(--ink)}
.btn.hot{background:linear-gradient(135deg,var(--lava),var(--lava2));border:0;color:#fff;
  font-weight:700;box-shadow:0 6px 22px rgba(255,59,32,.3)}
.btn.hot:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--lava);outline-offset:2px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);padding:0 12px 10px;border-bottom:1px solid var(--hair2)}
td{padding:11px 12px;border-bottom:1px solid var(--hair);color:var(--ink2);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(242,240,236,.015)}

/* big figures */
.figs{display:flex;gap:0}
.fig{flex:1;padding:4px 26px 4px 0;margin-right:26px;border-right:1px solid var(--hair)}
.fig:last-child{border-right:0;margin-right:0}
.fig .v{font:700 30px/1.1 var(--mono);letter-spacing:-.03em;color:var(--ink)}
.fig .v em{font-style:normal;font-size:15px;color:var(--faint)}
.fig .v.hot{background:linear-gradient(135deg,var(--lava),var(--lava2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.fig .k{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:7px}
.fig .n{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}

/* spine */
.spine{position:relative;padding-left:26px}
.spine::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;
  background:linear-gradient(180deg,var(--lava) 0%,rgba(255,122,69,.4) 30%,var(--hair2) 100%)}
.snode{position:relative;padding:0 0 18px}
.snode:last-child{padding-bottom:0}
.snode::before{content:"";position:absolute;left:-25.5px;top:6px;width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--faint)}
.snode.done::before{border-color:var(--ie);background:var(--ie)}
.snode.hot::before{border-color:var(--lava);background:var(--lava);box-shadow:0 0 10px rgba(255,59,32,.6)}
.snode .st{font:600 11px var(--mono);color:var(--faint);margin-right:10px}
.snode .sl{font-size:13px;color:var(--ink2)}
.snode.mut .sl{color:var(--faint)}

/* forms */
.f{padding:18px 0;border-bottom:1px solid var(--hair)}
.f label{display:flex;align-items:center;gap:9px;font:600 9.5px var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.f label em{font-style:normal;margin-left:auto;color:var(--ghost);letter-spacing:.08em}
.f.req.done label em{color:var(--ie)}
.f.req.done label em::before{content:"✓ "}
.fnum{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid var(--hair2);font:700 10px var(--mono);color:var(--dim);flex:none}
.f.req.done .fnum{border-color:rgba(74,222,151,.45);color:var(--ie)}
.input{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--hair2);
  border-radius:9px;background:var(--inset)}
.input .val{font-size:15px;font-weight:600;color:var(--ink)}
.input .ddown{margin-left:auto;color:var(--faint);font-size:12px}
.f .hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.55}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tag.pick{cursor:pointer;color:var(--dim)}
.tag.pick.on{color:var(--ink);border-color:var(--dim);background:rgba(242,240,236,.05)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--hair);
  border-radius:9px;background:var(--inset);font-size:13px;color:var(--ink2);cursor:pointer}
.opt:hover{border-color:var(--hair2)}
.opt.on{border-color:var(--dim)}
.opt .oh{font:500 11px var(--mono);color:var(--faint)}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ghost);flex:none}
.opt.on .radio{border-color:var(--ink);box-shadow:inset 0 0 0 3.5px var(--bg),inset 0 0 0 10px var(--ink)}
.check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ghost);flex:none}
.check.on{border-color:var(--ie);background:var(--ie)}

/* readiness */
.chk{padding:15px 0;border-bottom:1px solid var(--hair)}
.chk .toprow{display:flex;align-items:center;gap:12px}
.chk .glyph{font:700 12px var(--mono);width:16px;flex:none}
.chk.ok .glyph{color:var(--ie)}
.chk.fx .glyph{color:var(--warn)}
.chk.ad .glyph{color:var(--faint)}
.chk h4{font-size:14px;font-weight:600;color:var(--ink);flex:1}
.chk .act{flex:none;text-align:right}
.chk p{font-size:12.5px;color:var(--dim);margin:5px 0 0 28px;max-width:56ch;line-height:1.55}
.chk .mech{font:500 10px var(--mono);color:var(--faint);margin-top:6px;letter-spacing:.02em;white-space:nowrap}
.fixbtn{font:700 12px var(--sans);color:var(--warn);background:rgba(245,165,36,.08);
  border:1px solid rgba(245,165,36,.4);border-radius:7px;padding:7px 14px;cursor:pointer}
.fixbtn:hover{background:rgba(245,165,36,.14)}
details.instr{font-size:12.5px;color:var(--dim)}
details.instr summary{cursor:pointer;font-weight:600;color:var(--ink2);list-style:none}
details.instr summary::after{content:" ↓";color:var(--faint)}
details.instr[open] summary::after{content:" ↑"}
details.instr div{margin-top:8px;font:12px/1.8 var(--mono);color:var(--dim)}

/* go bar */
.gobar{display:flex;align-items:center;gap:16px;margin-top:26px;padding:14px 16px;
  border:1px solid var(--hair2);border-radius:12px;background:var(--surf)}
.gobar .msg{font-size:13px;color:var(--dim)}
.gobar .msg b{color:var(--warn);font-weight:600}

/* river (hero) */
.riverwrap{position:relative;width:100%;aspect-ratio:2/1;max-height:580px}
.river{position:absolute;inset:0;width:100%;height:100%}
.rp{fill:none;stroke-width:1.75;stroke-linecap:round;stroke:var(--hair2)}
.rp.in{stroke:url(#gIN);stroke-width:2.25;stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
.rp.ie{stroke:url(#gIE);stroke-dasharray:4 8;animation:flow 1.5s linear infinite}
.rp.ka{stroke:url(#gKA);stroke-dasharray:4 8;animation:flow 1.7s linear infinite}
.rp.both1{stroke:url(#gIE);stroke-dasharray:4 8;animation:flow 1.4s linear infinite}
.rp.both2{stroke:url(#gKA);stroke-dasharray:4 8;animation:flow 1.4s linear infinite .7s}
.rp.sec{stroke:url(#gSEC);stroke-dasharray:4 8;animation:flow 1.9s linear infinite}
.rp.arch{stroke:var(--ghost);stroke-dasharray:2 9;opacity:.6}
@keyframes flow{to{stroke-dashoffset:-12}}
.node{position:absolute;text-align:center;transform:translateY(-6%)}
.nlbl{margin-top:10px;font:700 9.5px var(--mono);letter-spacing:.13em;color:var(--dim)}
.nlbl span{display:block;font:500 9px var(--mono);letter-spacing:.04em;color:var(--faint);margin-top:3px;text-transform:none}
.ring{width:86px;height:86px;border-radius:50%;border:1.5px solid rgba(255,122,69,.55);margin:0 auto;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle,rgba(255,59,32,.12),transparent 70%)}
.ring span{font:700 19px var(--mono);letter-spacing:-.02em}
.ring2{position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(255,122,69,.3);
  animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ftok{position:absolute;display:flex;align-items:center;gap:6px;font:600 10.5px var(--mono);
  color:var(--ink);background:var(--raise);border:1px solid var(--hair2);border-radius:6px;
  padding:4px 9px;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:bob 2.6s ease-in-out infinite}
.ftok i{width:6px;height:6px;border-radius:2px;display:block}
.ftok.dim{opacity:.6}
@keyframes bob{50%{transform:translateY(-3px)}}
.term{position:absolute;width:23%;min-width:200px;padding:11px 14px;border:1px solid var(--hair);
  border-radius:11px;background:rgba(20,24,29,.82);backdrop-filter:blur(4px)}
.term b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em}
.term>span{display:block;font:500 9.5px var(--mono);color:var(--faint);margin-top:3px}
.term .tmeta{display:flex;align-items:center;gap:8px;margin-top:9px}
.term .tsub{font-size:9.5px;color:var(--faint)}
.term.hotT{border-color:rgba(180,155,246,.4);
  box-shadow:inset 3px 0 0 var(--ie),inset 6px 0 0 var(--ka),0 10px 30px rgba(0,0,0,.35)}
.term.archT{opacity:.62}

/* lanes (hero) */
.hero{border:1px solid var(--hair);border-radius:16px;background:
  linear-gradient(180deg,rgba(242,240,236,.015),transparent 120px),var(--bg2);
  padding:30px clamp(16px,3vw,34px);overflow:hidden}
.hgrid{display:grid;grid-template-columns:128px 44px 168px 44px 1fr;align-items:center;gap:0}
.pilebox{text-align:center}
.pilewrap{position:relative;width:74px;height:88px;margin:0 auto}
.sheet{position:absolute;inset:0;border-radius:7px;background:var(--raise);border:1px solid var(--hair2)}
.sheet:nth-child(1){transform:rotate(-5deg) translate(-7px,3px);opacity:.45}
.sheet:nth-child(2){transform:rotate(3.5deg) translate(6px,1px);opacity:.7}
.sheet:nth-child(3){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sheet .cnt{font:700 26px var(--mono);letter-spacing:-.03em}
.sheet .cl{font:600 8.5px var(--mono);letter-spacing:.1em;color:var(--faint)}
.pilebox .plbl{margin-top:12px;font:600 9.5px var(--mono);letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.pilebox .psub{font:500 10px var(--mono);color:var(--ghost);margin-top:3px}
.link{height:1.5px;background:linear-gradient(90deg,var(--hair2),var(--faint));position:relative}
.link::after{content:"";position:absolute;right:0;top:-2.75px;width:0;height:0;
  border-left:5px solid var(--faint);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.clsbox{border:1px solid var(--hair2);border-radius:12px;padding:15px 16px;background:var(--surf)}
.clsbox h4{font-size:13.5px;font-weight:700}
.clsbox p{font:500 10.5px var(--mono);color:var(--faint);margin-top:5px;line-height:1.7}
.clsbox .live{display:flex;align-items:center;gap:7px;margin-top:10px;font:600 10.5px var(--mono);color:var(--warn)}
.clsbox .live i{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.25}}
.lanestack{display:flex;flex-direction:column;gap:10px;padding-left:0}
.lrow{display:grid;grid-template-columns:200px 1fr 42px;gap:16px;align-items:center;
  padding:12px 16px;border:1px solid var(--hair);border-radius:12px;background:rgba(20,24,29,.55)}
.lrow .lname{display:flex;flex-direction:column;gap:3px}
.lrow .lname b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.lrow .lname span{font:500 10px var(--mono);color:var(--faint);letter-spacing:.02em}
.lrow .cnt{font:700 17px var(--mono);color:var(--ink2);text-align:right}
.toks{display:flex;gap:6px;flex-wrap:wrap}
.tok{display:flex;align-items:center;gap:7px;font:600 11px var(--mono);color:var(--ink2);
  background:var(--raise);border:1px solid var(--hair2);border-radius:7px;padding:5.5px 10px}
.tok i{width:6px;height:6px;border-radius:2px;background:var(--tc,var(--arch))}
.tok.live{border-color:rgba(245,165,36,.5);animation:blink 1.6s infinite}
.tok small{font:500 10px var(--mono);color:var(--faint)}
.lrow.ie{box-shadow:inset 3px 0 0 var(--ie)}
.lrow.ka{box-shadow:inset 3px 0 0 var(--ka)}
.lrow.both{box-shadow:inset 3px 0 0 var(--ie),inset 6px 0 0 var(--ka)}
.lrow.sec{box-shadow:inset 3px 0 0 var(--sec)}
.lrow.arch{box-shadow:inset 3px 0 0 var(--ghost);opacity:.75}
.tickline{display:flex;gap:26px;margin-top:22px;padding-top:16px;border-top:1px solid var(--hair);
  font:500 11.5px var(--mono);color:var(--faint);flex-wrap:wrap}
.tickline b{color:var(--ink2);font-weight:600}

/* inspector */
.insp{margin-top:22px;border:1px solid var(--hair);border-radius:14px;background:var(--bg2);padding:22px 26px}
.insp .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.insp .head .fn{font:600 14px var(--mono);letter-spacing:-.01em}
.insp .head .rt{margin-left:auto;font:500 10px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.kvrow{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 24px;margin-top:18px}
.kv .k{font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.kv .v{font:600 13px var(--mono);margin-top:4px;color:var(--ink2)}
.pull{margin-top:20px;padding:16px 20px;border-left:2px solid var(--lava);background:rgba(255,59,32,.035);
  border-radius:0 10px 10px 0;font-size:14px;line-height:1.65;color:var(--ink2);max-width:88ch}
.pull .plbl{font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  display:block;margin-bottom:6px}

/* ask */
.qa{margin:26px 0}
.qq{display:flex;justify-content:flex-end}
.qq span{font-size:14.5px;font-weight:600;color:var(--ink);background:var(--raise);
  border:1px solid var(--hair2);padding:10px 16px;border-radius:12px 12px 4px 12px;max-width:72%}
.path{display:flex;align-items:center;gap:10px;margin:12px 0;font:500 11px var(--mono);color:var(--faint)}
.path .eng{font-weight:700;padding:3px 10px;border-radius:100px;border:1px solid}
.path .eng.g{color:var(--sec);border-color:rgba(92,168,232,.4)}
.path .eng.k{color:var(--ka);border-color:rgba(180,155,246,.4)}
.aa{border:1px solid var(--hair);border-radius:4px 14px 14px 14px;background:var(--bg2);padding:18px 22px;
  position:relative;overflow:hidden}
.aa::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ac,var(--hair2))}
.aa .lede{font-size:14.5px;line-height:1.65;color:var(--ink2)}
.aa .lede b{color:var(--ink);font-weight:700}
.code{margin-top:13px;padding:11px 14px;border-radius:9px;background:var(--inset);
  border:1px solid var(--hair);font:12px/1.6 var(--mono);color:#8FC7EE;overflow-x:auto}
.cts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.cts span{font:500 11px var(--mono);color:var(--ka);border:1px solid rgba(180,155,246,.3);
  border-radius:6px;padding:3.5px 10px}
.meta{margin-top:12px;font:500 10.5px var(--mono);color:var(--faint)}
.askrow{display:flex;gap:12px;margin-top:34px;padding:8px 8px 8px 20px;border:1px solid var(--hair2);
  border-radius:14px;background:var(--surf);align-items:center}
.askrow input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:15px var(--sans)}
.askrow input::placeholder{color:var(--faint)}

/* trend bars */
.trend{display:grid;grid-template-columns:58px 1fr 48px;gap:14px;align-items:center;padding:7px 0}
.trend .d{font:500 11.5px var(--mono);color:var(--faint)}
.trend .bar{height:7px;border-radius:100px;background:var(--raise);overflow:hidden}
.trend .bar i{display:block;height:100%;border-radius:100px}
.trend .v{font:600 12px var(--mono);text-align:right;color:var(--ink2)}

.callout{margin-top:34px;padding:20px 24px;border:1px solid var(--hair);border-radius:14px;
  background:linear-gradient(135deg,rgba(255,59,32,.05),transparent 55%),var(--bg2)}
.callout b{display:block;font-size:14px;margin-bottom:6px}
