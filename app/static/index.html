<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocFlow</title>
<style>
:root{
  --bg:#0E1114; --bg2:#111519; --surf:#14181D; --raise:#1A1F26; --inset:#0B0E11;
  --ink:#F2F0EC; --ink2:#C7CBD1; --dim:#9BA3AD; --faint:#5C6670; --ghost:#343B44;
  --hair:rgba(242,240,236,.07); --hair2:rgba(242,240,236,.14);
  --lava:#FF3B20; --lava2:#FF7A45;
  --ie:#4ADE97; --ka:#B49BF6; --sec:#5CA8E8; --arch:#8A939E; --warn:#F5A524;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 80% -180px, rgba(255,59,32,.05), transparent 60%),var(--bg);
  color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.mast{display:flex;align-items:center;gap:34px;height:58px;padding:0 clamp(20px,4vw,48px);
  border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(14,17,20,.86);
  backdrop-filter:blur(10px);z-index:10}
.wordmark{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.mk{width:11px;height:11px;border-radius:2.5px;background:linear-gradient(135deg,var(--lava),var(--lava2));
  box-shadow:0 0 16px rgba(255,59,32,.45)}
.mast nav{display:flex;gap:4px;height:100%}
.mast nav button{background:none;border:0;color:var(--faint);font:500 13.5px var(--sans);
  padding:0 13px;cursor:pointer;position:relative;height:100%}
.mast nav button:hover{color:var(--ink2)}
.mast nav button.on{color:var(--ink)}
.mast nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--lava),var(--lava2));border-radius:2px}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws{font-size:12.5px;color:var(--dim)}
main{max-width:1140px;margin:0 auto;padding:44px clamp(20px,4vw,48px) 96px}
.over{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
h1{font-size:clamp(24px,3.2vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.1;
  margin:10px 0 10px;text-wrap:balance}
.dek{color:var(--dim);font-size:15px;max-width:68ch;line-height:1.65}
.rule{height:1px;background:var(--hair);margin:30px 0}
.sect{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin:38px 0 16px;display:flex;align-items:center;gap:14px}
.sect::after{content:"";flex:1;height:1px;background:var(--hair)}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);
  padding:2.5px 8px;border-radius:100px;border:1px solid var(--hair2);color:var(--dim)}
.tag .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.ie{color:var(--ie);border-color:rgba(74,222,151,.3)}
.tag.ka{color:var(--ka);border-color:rgba(180,155,246,.32)}
.tag.sec{color:var(--sec);border-color:rgba(92,168,232,.32)}
.tag.warn{color:var(--warn);border-color:rgba(245,165,36,.34)}
.tag.mut{color:var(--faint)}
.btn{font:600 13px var(--sans);padding:9px 18px;border-radius:8px;border:1px solid var(--hair2);
  background:transparent;color:var(--ink2);cursor:pointer;transition:border-color .15s,color .15s;
  white-space:nowrap}
.btn:hover{border-color:var(--dim);color:var(--ink)}
.btn.hot{background:linear-gradient(135deg,var(--lava),var(--lava2));border:0;color:#fff;
  font-weight:700;box-shadow:0 6px 22px rgba(255,59,32,.3)}
.btn.hot:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--lava);outline-offset:2px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);padding:0 12px 10px;border-bottom:1px solid var(--hair2)}
td{padding:11px 12px;border-bottom:1px solid var(--hair);color:var(--ink2);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.figs{display:flex;gap:0;flex-wrap:wrap}
.fig{flex:1;min-width:170px;padding:4px 26px 4px 0;margin-right:26px;border-right:1px solid var(--hair)}
.fig:last-child{border-right:0;margin-right:0}
.fig .v{font:700 28px/1.1 var(--mono);letter-spacing:-.03em}
.fig .v.hot{background:linear-gradient(135deg,var(--lava),var(--lava2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.fig .k{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:7px}
.fig .n{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.split{display:grid;grid-template-columns:5fr 6fr;gap:clamp(24px,4vw,56px)}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.f{padding:16px 0;border-bottom:1px solid var(--hair)}
.f label{display:flex;align-items:center;gap:9px;font:600 9.5px var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.f label em{font-style:normal;margin-left:auto;color:var(--ghost);letter-spacing:.08em}
.f.done label em{color:var(--ie)}
.f.done label em::before{content:"✓ "}
.fnum{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid var(--hair2);font:700 10px var(--mono);color:var(--dim)}
.f.done .fnum{border-color:rgba(74,222,151,.45);color:var(--ie)}
input.ctl, select.ctl{width:100%;padding:11px 14px;border:1px solid var(--hair2);border-radius:9px;
  background:var(--inset);color:var(--ink);font:600 14.5px var(--sans);outline:none}
input.ctl:focus, select.ctl:focus{border-color:var(--dim)}
select.ctl{appearance:none}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.55}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tag.pick{cursor:pointer}
.tag.pick.on{color:var(--ink);border-color:var(--dim);background:rgba(242,240,236,.05)}
.chk{padding:14px 0;border-bottom:1px solid var(--hair)}
.chk .toprow{display:flex;align-items:center;gap:12px}
.chk .glyph{font:700 12px var(--mono);width:16px}
.chk.ok .glyph{color:var(--ie)} .chk.fx .glyph{color:var(--warn)} .chk.ad .glyph{color:var(--faint)}
.chk h4{font-size:14px;font-weight:600;flex:1}
.chk p{font-size:12.5px;color:var(--dim);margin:5px 0 0 28px;max-width:56ch}
.fixbtn{font:700 12px var(--sans);color:var(--warn);background:rgba(245,165,36,.08);
  border:1px solid rgba(245,165,36,.4);border-radius:7px;padding:7px 14px;cursor:pointer;
  white-space:nowrap;display:inline-block}
.fixbtn:hover{background:rgba(245,165,36,.16)}
.chk .req{font:700 8.5px var(--mono);letter-spacing:.12em;color:var(--lava2);
  border:1px solid rgba(255,122,69,.45);border-radius:3px;padding:1px 5px;vertical-align:2px}
.chk .opt{font:700 8.5px var(--mono);letter-spacing:.12em;color:var(--ghost);
  border:1px solid var(--hair2);border-radius:3px;padding:1px 5px;vertical-align:2px}
.steps{margin:9px 0 0 28px;padding:0;color:var(--dim);font-size:12.5px;line-height:1.75}
.steps li{margin:0 0 2px}
.dlink{display:inline-block;margin:8px 0 0 28px;font:600 11.5px var(--mono);color:var(--sec);
  text-decoration:none;border-bottom:1px solid rgba(92,168,232,.35)}
.fixout{margin:8px 0 0 28px;font:500 11.5px var(--mono);line-height:1.6}
.fixout.good{color:var(--ie)} .fixout.bad{color:var(--warn)}
.fixout.good:not(:empty)::before{content:"✓ "}
.fixout.bad:not(:empty)::before{content:"! "}
.said{margin-top:6px;color:var(--faint);font-size:11px}
.said summary{cursor:pointer;color:var(--dim);list-style:none}
.said summary::after{content:" ▾"}
.said[open] summary::after{content:" ▴"}
.waitfor{font:600 11px var(--mono);color:var(--faint);border:1px dashed var(--hair2);
  border-radius:7px;padding:6px 11px;white-space:nowrap}
.movehead{display:flex;align-items:center;gap:12px;margin:32px 0 2px}
.movehead.first{margin-top:6px}
.mnum{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--hair2);flex:none;
  display:inline-flex;align-items:center;justify-content:center;font:700 12px var(--mono);color:var(--dim)}
.movehead h3{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.movehead .mstat{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.movehead.done .mnum{border-color:rgba(74,222,151,.5);color:var(--ie)}
.movehead.done .mstat{color:var(--ie)}
.beat{position:relative;padding:0 0 22px}
.beat::before{content:"";position:absolute;left:-25.5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--faint)}
.beat .bt{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.beat .bs{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:4px;max-width:52ch}
.autohead{margin:20px 0 2px;font:600 10px var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint)}
.chk.auto .glyph{color:var(--faint)}
.chk.auto h4{color:var(--ink2);font-weight:600}
.savestat{font:500 11px var(--mono);color:var(--faint);margin-left:auto;transition:opacity .4s}
/* One obvious action beats a panel of buttons. Detail stays one click away. */
.setupcard{border:1px solid var(--hair2);border-radius:13px;padding:20px 22px;margin:12px 0 8px;
  background:linear-gradient(135deg,rgba(255,59,32,.06),transparent 62%),var(--bg2)}
.setupcard.ready{background:linear-gradient(135deg,rgba(74,222,151,.06),transparent 62%),var(--bg2);
  border-color:rgba(74,222,151,.3)}
.sc-t{font-size:17px;font-weight:700;letter-spacing:-.015em}
.sc-s{font-size:13.5px;color:var(--dim);margin:6px 0 15px;max-width:52ch}
.setupcard.ready .sc-s{margin-bottom:0}
.setupcard .fixout{margin-left:0}
.detail-toggle{margin-top:14px}
.detail-toggle summary{cursor:pointer;font:600 11px var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);list-style:none}
.detail-toggle summary::after{content:" ▾"}
.detail-toggle[open] summary::after{content:" ▴"}
.sc-step{display:flex;gap:9px;align-items:baseline;font:500 12.5px var(--mono);
  color:var(--dim);padding:3px 0}
.sc-step b{font-weight:700}
.sc-step.ok b{color:var(--ie)} .sc-step.bad b{color:var(--warn)}
.adv summary{cursor:pointer;font:600 9.5px var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);list-style:none;padding:6px 0}
.adv summary::after{content:" ▾"}
.adv[open] summary::after{content:" ▴"}
.gobar{display:flex;align-items:center;gap:16px;margin-top:24px;padding:14px 16px;
  border:1px solid var(--hair2);border-radius:12px;background:var(--surf)}
.gobar .msg{font-size:13px;color:var(--dim)}
.spine{position:relative;padding-left:26px;margin-top:8px}
.spine::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;
  background:linear-gradient(180deg,var(--lava),rgba(255,122,69,.4) 30%,var(--hair2))}
.snode{position:relative;padding:0 0 14px;font-size:13px;color:var(--ink2)}
.snode::before{content:"";position:absolute;left:-25.5px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--faint)}
.snode.ok::before{border-color:var(--ie);background:var(--ie)}
.snode.run::before{border-color:var(--lava);background:transparent;animation:steppulse 1.6s ease-in-out infinite}
.snode.err::before{border-color:var(--lava);background:var(--lava);box-shadow:0 0 10px rgba(255,59,32,.6)}
.snode.warn::before{border-color:var(--warn);background:var(--warn)}
@keyframes steppulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.5)}50%{box-shadow:0 0 0 5px rgba(255,54,33,0)}}
.snode .st{font:600 11px var(--mono);color:var(--faint);margin-right:10px}
.snode .det{display:block;font:500 11px var(--mono);color:var(--faint);margin-top:2px}
.riverwrap{position:relative;width:100%}
.fgrid{position:relative;z-index:1;display:grid;grid-template-columns:150px 210px minmax(0,1fr);gap:0 30px;align-items:stretch}
.fover{font:600 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.fcard{border:1px solid var(--hair);border-radius:14px;background:var(--bg2);padding:14px 16px}
.fpath{font:500 9px var(--mono);color:var(--faint);word-break:break-all;margin-bottom:6px}
.fcard b{font-size:13px}
.fmeta{font:500 10.5px var(--mono);color:var(--dim);margin-top:4px}
.fdocs{margin-top:10px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;gap:4px;opacity:.75}
.fdrow{display:flex;align-items:center;gap:6px;font:500 10px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}
.fdrow em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.fdrow i{flex:none;font:700 7.5px var(--mono);font-style:normal;color:var(--lava2);border:1px solid rgba(255,122,69,.4);border-radius:4px;padding:1px 4px}
.fmid{display:flex;flex-direction:column}
.flabeler{text-align:center;align-self:center;width:100%;padding:22px 16px;
  border-color:rgba(255,122,69,.45);box-shadow:0 0 0 1px rgba(255,122,69,.14),0 0 26px rgba(255,59,32,.10)}
.flabeler>b{font-size:15px}
#f-inbox{border-style:dashed;border-color:var(--hair2)}
#f-inbox b{font-size:11.5px}
.flabeler .fsub{display:block;font:500 10px var(--mono);color:var(--faint);margin-top:6px;text-transform:none}
.flaneswrap{padding-left:72px}
.flaneswrap .fover{margin-left:-72px}
.fright{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:12px 22px}
.flane{position:relative;border:1px solid var(--hair);border-radius:12px;background:var(--bg2);padding:11px 14px 12px 18px;overflow:hidden}
.flane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc,var(--hair2))}
.flh{display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap;min-width:0}
.flh .ln,.flh b,.flh .cnt{white-space:nowrap}
.flh .ln{font:600 8.5px var(--mono);letter-spacing:.14em;color:var(--faint)}
.flh b{font-size:13.5px}
.flh .cnt{margin-left:auto;font:600 10.5px var(--mono);color:var(--dim)}
.fchips{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.fchip{border:1px solid var(--hair);border-radius:9px;padding:6px 10px;background:var(--surf)}
.fchip .ct{font:700 7.5px var(--mono);letter-spacing:.13em}
.fchip .cs{display:block;font:500 9.5px var(--mono);color:var(--faint);margin-top:2px}
.fchip.cie .ct{color:var(--ie)} .fchip.cka .ct{color:var(--ka)}
.fchip.csec{border-color:rgba(92,168,232,.4)} .fchip.csec .ct{color:var(--sec)}
.fchip.cmut .ct{color:var(--faint)}
.fthen{font:600 8px var(--mono);letter-spacing:.12em;color:var(--faint)}
.flane .fnow{display:none;position:absolute;right:12px;bottom:9px;font:600 8.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--lava2)}
.flane.working{border-color:rgba(255,122,69,.55);box-shadow:0 0 0 1px rgba(255,122,69,.22)}
.flane.working .fnow{display:block}
.ffcard{border:1px dashed var(--hair2);border-radius:12px;padding:10px 12px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.ffcard .fpath{margin-bottom:3px}
.ffcard .fo{font:500 10px var(--mono);color:var(--dim)}
.flegend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--hair)}
.flegend span{font:500 9.5px var(--mono);color:var(--faint)}
.flegend b{color:var(--dim)}
.river{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.rp{fill:none;stroke-width:1.75;stroke-linecap:round}
.rp.on{stroke-dasharray:4 8;animation:flow 1.5s linear infinite}
.rp.hot{stroke-width:2.6;filter:drop-shadow(0 0 5px currentColor);animation-duration:.85s}
.term.working{border-color:rgba(255,122,69,.55);box-shadow:0 0 0 1px rgba(255,122,69,.25),
  0 6px 26px rgba(255,59,32,.14)}
.term .now{display:none;font:600 8.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--lava2);margin-top:5px}
.term.working .now{display:block}
.stagenow{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--lava2);margin-top:6px;min-height:12px}
@keyframes pulsering{0%{transform:scale(1);opacity:.55}50%{transform:scale(1.13);opacity:.12}100%{transform:scale(1);opacity:.55}}
.ring.busy{animation:pulsering 1.25s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.hero{border:1px solid var(--hair);border-radius:16px;background:
  linear-gradient(180deg,rgba(242,240,236,.015),transparent 120px),var(--bg2);
  padding:16px 10px 20px;overflow:hidden}
.node{position:absolute;text-align:center}
.nlbl{margin-top:9px;font:700 9.5px var(--mono);letter-spacing:.13em;color:var(--dim)}
.nlbl span{display:block;font:500 9px var(--mono);color:var(--faint);margin-top:3px;text-transform:none}
.pilewrap{position:relative;width:70px;height:84px;margin:0 auto}
.sheet{position:absolute;inset:0;border-radius:7px;background:var(--raise);border:1px solid var(--hair2)}
.sheet:nth-child(1){transform:rotate(-5deg) translate(-7px,3px);opacity:.45}
.sheet:nth-child(2){transform:rotate(3.5deg) translate(6px,1px);opacity:.7}
.sheet:nth-child(3){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sheet .cnt{font:700 24px var(--mono)}
.sheet .cl{font:600 8.5px var(--mono);color:var(--faint)}
.ring{width:82px;height:82px;border-radius:50%;border:1.5px solid rgba(255,122,69,.55);margin:0 auto;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle,rgba(255,59,32,.12),transparent 70%)}
.ring span{font:700 18px var(--mono)}
.ring2{position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(255,122,69,.3);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.term{position:absolute;width:24%;min-width:198px;padding:10px 13px;border:1px solid var(--hair);
  border-radius:11px;background:rgba(20,24,29,.85);backdrop-filter:blur(4px)}
.term b{display:block;font-size:12.5px;font-weight:700}
.term>span{display:block;font:500 9.5px var(--mono);color:var(--faint);margin-top:3px}
.term .tmeta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.term.hotT{border-color:rgba(180,155,246,.4);box-shadow:inset 3px 0 0 var(--ie),inset 6px 0 0 var(--ka)}
.term.archT{opacity:.62}
.tickline{display:flex;gap:24px;margin:8px 24px 0;padding-top:14px;border-top:1px solid var(--hair);
  font:500 11.5px var(--mono);color:var(--faint);flex-wrap:wrap}
.tickline b{color:var(--ink2)}
.insp{margin-top:20px;border:1px solid var(--hair);border-radius:14px;background:var(--bg2);padding:20px 24px}
.kvrow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 22px;margin-top:14px}
@media(max-width:900px){.kvrow{grid-template-columns:1fr 1fr}}
.kv .k{font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.kv .v{font:600 13px var(--mono);margin-top:4px;color:var(--ink2)}
.pull{margin-top:16px;padding:14px 18px;border-left:2px solid var(--lava);background:rgba(255,59,32,.035);
  border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.pull .plbl{font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  display:block;margin-bottom:5px}
.qa{margin:24px 0}
.qq{display:flex;justify-content:flex-end}
.qq span{font-size:14.5px;font-weight:600;background:var(--raise);border:1px solid var(--hair2);
  padding:10px 16px;border-radius:12px 12px 4px 12px;max-width:78%}
.path{display:flex;align-items:center;gap:10px;margin:12px 0;font:500 11px var(--mono);color:var(--faint);flex-wrap:wrap}
.path .eng{font-weight:700;padding:3px 10px;border-radius:100px;border:1px solid}
.path .eng.g{color:var(--sec);border-color:rgba(92,168,232,.4)}
.path .eng.k{color:var(--ka);border-color:rgba(180,155,246,.4)}
.aa{border:1px solid var(--hair);border-radius:4px 14px 14px 14px;background:var(--bg2);padding:16px 20px;
  position:relative;overflow:hidden}
.aa::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ac,var(--hair2))}
.aa .lede{font-size:14.5px;line-height:1.65;color:var(--ink2);white-space:pre-wrap}
.code{margin-top:12px;padding:11px 14px;border-radius:9px;background:var(--inset);
  border:1px solid var(--hair);font:12px/1.6 var(--mono);color:#8FC7EE;overflow-x:auto}
.meta{margin-top:11px;font:500 10.5px var(--mono);color:var(--faint)}
.askrow{display:flex;gap:12px;margin-top:28px;padding:8px 8px 8px 20px;border:1px solid var(--hair2);
  border-radius:14px;background:var(--surf);align-items:center}
.askrow input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:15px var(--sans)}
.askrow input::placeholder{color:var(--faint)}
.trend{display:grid;grid-template-columns:minmax(90px,160px) 1fr 90px;gap:14px;align-items:center;padding:7px 0}
.trend .d{font:500 12px var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend .bar{height:7px;border-radius:100px;background:var(--raise);overflow:hidden}
.trend .bar i{display:block;height:100%;border-radius:100px;background:var(--ghost)}
.trend .v{font:600 12px var(--mono);text-align:right;color:var(--ink2)}
.callout{margin-top:30px;padding:18px 22px;border:1px solid var(--hair);border-radius:14px;
  background:linear-gradient(135deg,rgba(255,59,32,.05),transparent 55%),var(--bg2)}
.callout b{display:block;font-size:14px;margin-bottom:6px}
.callout p{font-size:13.5px;color:var(--dim);line-height:1.65}
.empty{padding:52px 20px;text-align:center;border:1px dashed var(--hair2);border-radius:14px;color:var(--dim)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
.prompter{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;
  gap:14px;padding:9px clamp(20px,4vw,48px);background:rgba(14,17,20,.92);
  border-top:1px solid var(--hair);backdrop-filter:blur(8px);font:500 12.5px var(--sans)}
.prompter .plab{font:700 9px var(--mono);letter-spacing:.18em;color:var(--lava2);
  text-transform:uppercase;flex:none}
.prompter .pline{color:var(--ink2)}
.prompter .pcue{margin-left:auto;font:600 11px var(--mono);color:var(--faint);
  white-space:nowrap}
.prompter .pcue b{color:var(--dim);font-weight:600}
.prompter .px{flex:none;background:none;border:0;color:var(--faint);cursor:pointer;
  font-size:14px;padding:2px 6px}
.prompter .px:hover{color:var(--ink)}
body[data-prompter="1"] main{padding-bottom:150px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--hair2);
  border-top-color:var(--lava);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="wordmark"><span class="mk"></span>DocFlow</div>
  <nav id="nav">
    <button data-go="start" class="on">Start</button>
    <button data-go="docs">Documents</button>
    <button data-go="flow">Flow</button>
    <button data-go="ask">Ask</button>
    <button data-go="recover">Recover</button>
    <button data-go="built">Built</button>
    <span id="custompages" style="display:contents"></span>
    <button data-go="newpage" title="Add a page for this audience" style="opacity:.55">+ Page</button>
  </nav>
  <div class="mast-right"><span class="ws" id="wsname"></span></div>
</header>
<main id="stage"><div class="empty"><span class="spin"></span></div></main>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const stage = $("#stage");
const S = { cfg:null, scan:null, ready:null, golog:null, state:null, page:"start",
            pollers:[], asking:false, turns:[], fixout:{} };

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mdb = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const isMoneyCol = n => /amount|total|sum|cost|usd|value|spend/i.test(n||"");
const fmtCell = (v,col)=>{ const n=parseFloat(v);
  if(!isNaN(n) && String(v).match(/^-?\d+(\.\d+)?$/))
    return isMoneyCol(col)?("$"+n.toLocaleString(undefined,{maximumFractionDigits:2})):n.toLocaleString();
  return esc(v); };
const j = async (url, opts) => { const r = await fetch(url, opts); const ct = r.headers.get("content-type")||"";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body&&body.error)||("request failed: "+r.status)); return body; };
const post = (url, data) => j(url, {method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify(data||{})});
const money = v => v==null?"":"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
function stopPollers(){ S.pollers.forEach(clearInterval); S.pollers=[]; }
function poll(fn, ms){ fn(); const id=setInterval(fn, ms); S.pollers.push(id); return id; }

/* ---------------- START ---------------- */
async function loadStart(){
  const [cfg, scan, ready] = await Promise.all([
    j("/api/config"), j("/api/scan").catch(e=>({error:String(e)})), j("/api/readiness").catch(e=>({checks:[],error:String(e)}))]);
  S.cfg=cfg; S.scan=scan; S.ready=ready;
  renderStart();
}
function formComplete(){
  const c=S.cfg||{}; return !!(c.company && c.industry && c.catalog && c.schema);
}
function gateMsg(){
  const rd=S.ready||{}, blockers=rd.blockers||[];
  const phase = S.golog && S.golog.phase;
  if(phase==="error"){
    const g=S.golog||{};
    const where = g.failed_step ? `${g.failed_step} failed. ` : "The run stopped. ";
    return where + (g.error || "") + " — press Go to retry; finished steps are reused.";
  }
  if(phase==="running") return "Working. The right column is live.";
  if(phase==="prepared") return "Everything is staged and nothing has moved. Open Flow so the room is watching, then press.";
  if(blockers.length) return `Step 1 first — ${blockers.length} check${blockers.length>1?"s":""} still red.`;
  if(!formComplete()) return "Step 2 needs a customer name and an industry.";
  return "Go stages everything — documents, agents — then stops and waits for your cue to process.";
}
function goAllowed(){
  const rd=S.ready||{};
  const phase = S.golog && S.golog.phase;
  if(phase==="running") return false;
  if(phase==="prepared") return true;      // the button is now Process documents
  return formComplete() && !(rd.blockers||[]).length;
}
function renderStart(){
  const c=S.cfg||{}, scan=S.scan||{}, rd=S.ready||{checks:[]};
  const started = !!(S.golog && S.golog.steps && S.golog.steps.length);
  const cats = scan.catalogs||[];
  const cur = `${c.catalog||"workspace"}.${c.schema||"docflow"}`;
  const catOptions = [];
  cats.forEach(cat=> (cat.schemas.length?cat.schemas:["docflow"]).forEach(sc=>
    catOptions.push(`${cat.name}.${sc}`)));
  if(!catOptions.includes(cur)) catOptions.unshift(cur);
  const vols = scan.volumes||[];
  const doneN = ["company","industry"].filter(k=>c[k]).length;
  const blockers = rd.blockers||[];
  const company = c.company || "your customer";
  const ranSecs = S.golog && S.golog.sections ? S.golog.sections["Total, go to ready"] : null;

  stage.innerHTML = `
  <div class="over">Portable installer · this workspace</div>
  <h1>Two answers, one button.</h1>
  <p class="dek">Name a customer and an industry. The app writes their documents, builds the
    agents, routes every page through them on screen, and ends on pages their team could use
    tomorrow.</p>
  <div class="rule"></div>
  <div class="split">
    <div>
      <div class="over">You do three things</div>

      <div class="movehead first ${blockers.length?"":"done"}">
        <span class="mnum">1</span><h3>Set up this workspace</h3>
        <span class="mstat">${blockers.length?blockers.length+" to fix":"ready"}</span>
        <button class="btn" style="margin-left:10px;padding:4px 11px;font-size:11px" id="recheck">Re-check</button>
      </div>
      ${blockers.length ? `
        <div class="setupcard">
          <div class="sc-t">This workspace needs ${blockers.length} thing${blockers.length>1?"s":""}.</div>
          <div class="sc-s">A warehouse, a schema, a place for documents, a model that answers.
            One press creates whatever is missing.</div>
          <button class="btn hot" id="fixall">Set up this workspace</button>
          <div class="fixout ${S.fixout.all?S.fixout.all.cls:""}" id="out-all">${
            S.fixout.all?esc(S.fixout.all.text):""}</div>
          ${S.fixout.all&&S.fixout.all.steps?S.fixout.all.steps.map(x=>
            `<div class="sc-step ${x.ok?"ok":"bad"}"><b>${x.ok?"✓":"!"}</b>
              <span>${esc(x.label)} · ${esc(x.detail||"")}</span></div>`).join(""):""}
        </div>` : `
        <div class="setupcard ready">
          <div class="sc-t">This workspace is ready.</div>
          <div class="sc-s">Everything the run needs is in place.${
            (rd.unverified||[]).length?` Go proves ${esc(rd.unverified.join(" and ").toLowerCase())} in its first seconds.`:""}</div>
        </div>`}
      <details class="detail-toggle">
        <summary>All ${(rd.checks||[]).length} checks</summary>
        <div id="rdlist">${renderChecks(rd)}</div>
      </details>

      <div class="movehead ${doneN===2?"done":""}">
        <span class="mnum">2</span><h3>Name the customer</h3>
        <span class="mstat">${doneN} of 2</span><span class="savestat" id="savestat"></span>
      </div>
      <div class="f ${c.company?"done":""}" id="fw-company"><label>Customer name<em>required</em></label>
        <input class="ctl" id="f-company" value="${esc(c.company)}" placeholder="Who is this demo for?">
        <div class="hint">Appears on every page and inside every generated document.</div></div>
      <div class="f ${c.industry?"done":""}" id="fw-industry"><label>Industry<em>required</em></label>
        <input class="ctl" id="f-industry" value="${esc(c.industry)}" placeholder="Type any industry">
        <div class="chips">${["Manufacturing","Insurance","Healthcare","Financial services","Retail","Logistics"]
          .map(x=>`<span class="tag pick ${c.industry===x?"on":""}" data-ind="${x}">${x}</span>`).join("")}</div>
        <div class="hint">Type anything — the chips just fill the box for you. The industry drives
          the vocabulary, the suggested questions, and both operations pages.</div></div>
      <div class="f" style="border-bottom:0">
        <details class="adv">
          <summary>Where it writes, and which model · defaults are fine</summary>
          <div style="margin-top:12px">
            <label style="margin-bottom:7px">Catalog and schema</label>
            <select class="ctl mono" id="f-target">
              ${catOptions.map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}
              <option value="__custom">another catalog — type it in</option>
            </select>
            <input class="ctl mono" id="f-tcustom" placeholder="catalog.schema"
              style="display:none;margin-top:8px" value="">
            <div class="hint">Tables, the Genie space and run state land here.
              An existing catalog works — the app only adds its own schema,
              and setup creates the catalog only when it is missing.</div>
            <label style="margin:16px 0 7px">Customer documents</label>
            <select class="ctl mono" id="f-cvol">
              <option value="">No customer documents · generate everything</option>
              ${vols.map(v=>`<option ${c.customer_volume===v?"selected":""}>${esc(v)}</option>`).join("")}
            </select>
            <div class="hint">Point at a volume of the customer's PDFs and the run reads them in
              place, generating only what is missing.</div>
            <label style="margin:16px 0 7px">Model</label>
            <select class="ctl mono" id="f-model" style="font-size:13px">
              ${(m=>{const cur=c.chat_endpoint||"databricks-claude-sonnet-4-6";
                const list=m.includes(cur)?m:[cur,...m];
                return list.map(x=>`<option value="${esc(x)}" ${x===cur?"selected":""}>${esc(x)}${
                  x===scan.model_resolved?" · answers":x===cur&&!m.includes(cur)?" · configured, not seen here":""}</option>`).join("");
              })(scan.models||[])}
            </select>
            <div class="hint">${(scan.models||[]).length
              ? `${(scan.models||[]).length} model${(scan.models||[]).length>1?"s":""} found in this
                 workspace${scan.model_sources&&scan.model_sources.ai_gateway
                   ? ` · ${scan.model_sources.ai_gateway} from AI Gateway`:""}. Names are read from
                 the workspace, so they match what the Playground shows.`
              : `No models discovered${(scan.model_errors||[]).length
                   ? ` — ${esc((scan.model_errors||[])[0])}`:""}. Go still probes for one that answers.`}</div>
          </div>
        </details>
      </div>

      <div class="movehead ${S.golog&&S.golog.phase==="done"?"done":""}">
        <span class="mnum">3</span><h3>Press go</h3>
        <span class="mstat">${S.golog&&S.golog.phase==="done"&&ranSecs?`ran in ${ranSecs}s`
          :S.golog&&S.golog.phase==="prepared"?"staged · your cue":"~2 min"}</span>
      </div>
      ${S.golog&&S.golog.phase==="error"?`
        <div class="setupcard" style="border-color:rgba(245,165,36,.45)">
          <div class="sc-t">${esc(S.golog.failed_step||"The run")} stopped</div>
          <div class="sc-s">${esc(S.golog.error||"")}</div>
          <div class="sc-s" style="margin-bottom:0">Press <b>Try again</b>. Steps that
            already finished are reused, so a retry picks up where it left off.</div>
          ${S.golog.traceback?`<details class="said" style="margin-top:10px">
            <summary>technical detail</summary><pre style="white-space:pre-wrap;
            font:11px var(--mono);color:var(--faint);margin-top:6px">${esc(S.golog.traceback)}</pre>
          </details>`:""}
        </div>`:""}
      <div class="gobar">
        <button class="btn hot" id="gobtn" ${goAllowed()||S.golog&&S.golog.phase==="prepared"?"":"disabled"}>${
          S.golog&&S.golog.phase==="running"?"Running"
          :S.golog&&S.golog.phase==="prepared"?"Process documents"
          :S.golog&&S.golog.phase==="error"?"Try again":"Go"}</button>
        <span class="msg" id="gomsg">${esc(gateMsg())}</span>
      </div>
    </div>

    <div>
      <div class="over">The app does the rest</div>
      ${started ? `
      <div style="display:flex;align-items:baseline;gap:14px;margin:14px 0 14px">
        <span style="font:500 11.5px var(--mono);color:var(--dim)" id="runsum">${
          S.golog.phase==="running"?"working":S.golog.phase==="prepared"?"staged · nothing processed yet"
            :S.golog.phase==="done"?`ready in ${S.golog.sections["Total, go to ready"]||"—"}s`:"stopped"}</span>
      </div>
      <div class="spine" id="golog">${renderGolog()}</div>` : `
      <div class="spine" style="margin-top:16px">
        <div class="beat"><div class="bt">Writes ${esc(company)}'s documents</div>
          <div class="bs">24 watermarked PDFs in their name — invoices, warranty claims,
            contracts, an HR file — in their own volume folder.</div></div>
        <div class="beat"><div class="bt">Runs it all on your warehouse</div>
          <div class="bs">ai_classify reads every page and ai_extract pulls the fields, both in SQL — the same functions the Agent Bricks tiles wrap, with nothing to click. A Knowledge Assistant is created over the API and pointed at the documents, and a Genie space lands on the extracted tables.</div></div>
        <div class="beat"><div class="bt">Then waits for your cue</div>
          <div class="bs">Nothing processes until you press Process documents — from here or
            from the Flow page, with the room watching each page classified and sent down its
            lane: extraction, assistant, both, or secure filing that no AI reads.</div></div>
        <div class="beat"><div class="bt">Ends on pages their team could use</div>
          <div class="bs">A claims desk and a supplier desk built from the extracted fields, and
            Ask, where every answer cites the page it came from.</div></div>
      </div>
      <p class="hint" style="margin-top:6px">Everything lands in this workspace under
        ${esc(cur)}, and running go twice never duplicates any of it.</p>`}
    </div>
  </div>`;
  $("#wsname").textContent = c.company || "";
  bindStart();
}
function renderChecks(rd){
  const all = rd.checks||[];
  const byKey = Object.fromEntries(all.map(x=>[x.key,x]));
  const row = ch => {
    const blocking = !ch.ok && !ch.optional && !ch.untested;
    const cls = ch.ok?"ok":(ch.fixable_by_app?"fx":"ad");
    const glyph = ch.ok?"✓":(ch.untested?"·":(blocking?"!":"○"));
    const dep = ch.depends_on ? byKey[ch.depends_on] : null;
    const waiting = dep && !dep.ok ? dep.label : null;
    const act = ch.ok?"":(waiting
      ? `<span class="waitfor">after ${esc(waiting)}</span>`
      : ch.fixable_by_app
      ? `<button class="fixbtn" data-fix="${esc(ch.fix_endpoint)}" data-key="${esc(ch.key)}">${esc(ch.fix_label||"Fix")}</button>`
      : ch.untested
      ? `<span class="waitfor">verified at go</span>`
      : (ch.link?`<a class="fixbtn" style="text-decoration:none" href="${esc(ch.link)}" target="_blank" rel="noopener">${esc(ch.link_label||"Open")} ↗</a>`:""));
    const steps = (!ch.ok && !ch.untested && ch.steps && ch.steps.length)
      ? `<ol class="steps">${ch.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>` : "";
    const link2 = (!ch.ok && ch.link && ch.fixable_by_app)
      ? `<a class="dlink" href="${esc(ch.link)}" target="_blank" rel="noopener">${esc(ch.link_label||"Open in workspace")} ↗</a>` : "";
    return `<div class="chk ${cls}" id="chk-${esc(ch.key)}">
      <div class="toprow"><span class="glyph">${glyph}</span>
        <h4>${esc(ch.label)} <span class="${ch.optional?"opt":"req"}">${ch.optional?"optional":"required"}</span></h4>
        <div>${act}</div></div>
      <p>${esc(ch.detail||"")}${ch.human_action&&!ch.ok?" "+esc(ch.human_action):""}</p>
      ${steps}${link2}
      <div class="fixout ${S.fixout[ch.key]?S.fixout[ch.key].cls:""}" id="out-${esc(ch.key)}">${
        S.fixout[ch.key]?esc(S.fixout[ch.key].text):""}${
        S.fixout[ch.key]&&S.fixout[ch.key].detail
          ? `<details class="said"><summary>what Databricks reported</summary>${esc(S.fixout[ch.key].detail)}</details>`
          : ""}</div></div>`;
  };
  const main = all.filter(x=>!x.auto).map(row).join("");
  const auto = all.filter(x=>x.auto);
  const autoRows = auto.length ? `<div class="autohead">Built for you at go</div>` +
    auto.map(ch=>`<div class="chk auto"><div class="toprow"><span class="glyph">→</span>
      <h4>${esc(ch.label)}</h4></div><p>${esc(ch.detail||"")}</p></div>`).join("") : "";
  return (main + autoRows) || `<p class="hint">Readiness could not load. Re-check.</p>`;
}
function renderGolog(){
  const g=S.golog;
  if(!g || !g.steps || !g.steps.length)
    return `<div class="snode"><span class="st">—</span>Waiting for go. The log streams here.</div>`;
  return g.steps.map(x=>`<div class="snode ${x.status==="ok"?"ok":x.status==="err"?"err":x.status==="warn"?"warn":"run"}">
    <span class="st num">${x.t}s</span>${esc(x.name)}<span class="det">${esc(x.detail)}</span></div>`).join("")
    + (g.phase==="running" && !g.steps.some(x=>x.status==="run")
       ? `<div class="snode run"><span class="st"><span class="spin"></span></span>${esc(g.steps[g.steps.length-1].name)} finished · next step reporting</div>`
       : "");
}
/* Save without re-rendering: a rebuild mid-keystroke is how entries get lost. */
let _saveTimer=null;
function queueSave(){
  clearTimeout(_saveTimer);
  const st=$("#savestat"); if(st) st.textContent="saving…";
  _saveTimer=setTimeout(saveCfg, 700);
}
async function saveCfg(skipSync){
  clearTimeout(_saveTimer);
  let tv=$("#f-target").value;
  if(tv==="__custom"){ const tc=$("#f-tcustom"); tv=(tc&&tc.value.trim())||`${(S.cfg||{}).catalog||"workspace"}.${(S.cfg||{}).schema||"docflow"}`; }
  const t=tv.split(".");
  const body={ company:$("#f-company").value.trim(), industry:$("#f-industry").value.trim(),
    catalog:t[0], schema:t[1]||"docflow", customer_volume:$("#f-cvol").value,
    chat_endpoint:$("#f-model").value.trim() };
  S.cfg = await post("/api/config", body).catch(()=>S.cfg);
  if(!skipSync) syncFormState();
  const st=$("#savestat");
  if(st){ st.textContent="saved ✓"; setTimeout(()=>{const x=$("#savestat"); if(x&&x.textContent==="saved ✓") x.textContent="";},1800); }
}
function syncFormState(){
  const c=S.cfg||{};
  $("#wsname").textContent = c.company || "";
  const fc=$("#fw-company"), fi=$("#fw-industry");
  if(fc) fc.classList.toggle("done", !!c.company);
  if(fi) fi.classList.toggle("done", !!c.industry);
  document.querySelectorAll(".tag.pick").forEach(x=>
    x.classList.toggle("on", x.dataset.ind===c.industry));
  const gb=$("#gobtn"); if(gb) gb.disabled=!goAllowed();
  const gm=$("#gomsg"); if(gm) gm.textContent=gateMsg();
  const mh=document.querySelectorAll(".movehead")[1];
  if(mh){ const n=["company","industry"].filter(k=>c[k]).length;
    mh.classList.toggle("done", n===2);
    const ms=mh.querySelector(".mstat"); if(ms) ms.textContent=`${n} of 2`; }
}
function bindStart(){
  document.querySelectorAll(".tag.pick").forEach(x=>x.onclick=()=>{
    $("#f-industry").value=x.dataset.ind; saveCfg(); });
  ["f-company","f-industry","f-model"].forEach(id=>{ const el=$("#"+id);
    if(el){ el.oninput=queueSave; el.onchange=saveCfg; } });
  $("#f-target").onchange=e=>{ const tc=$("#f-tcustom");
    if(tc) tc.style.display = e.target.value==="__custom" ? "block" : "none";
    if(e.target.value!=="__custom") saveCfg(); else if(tc) tc.focus(); };
  const tcu=$("#f-tcustom"); if(tcu){ tcu.onchange=saveCfg; }
  $("#f-cvol").onchange=saveCfg;
  const rc=$("#recheck");
  if(rc) rc.onclick=async()=>{ S.ready=await j("/api/readiness").catch(()=>S.ready); renderStart(); };
  const fa=$("#fixall");
  if(fa) fa.onclick=async()=>{
    fa.disabled=true; fa.innerHTML=`<span class="spin"></span> Setting up`;
    let res=null;
    try{ res=await post("/api/fix/all"); }catch(e){ res={ok:false,error:e.message}; }
    if(res && res.steps){
      S.fixout.all={cls:res.ok?"good":"bad",
        text:res.ok?"Workspace ready.":`Still blocked by ${(res.blockers||[]).join(", ")}`,
        steps:res.steps};
    } else {
      S.fixout.all={cls:"bad",text:(res&&(res.error||res.human_action))||"Could not complete."};
    }
    S.ready=(res&&res.readiness)?res.readiness:await j("/api/readiness").catch(()=>S.ready);
    renderStart();
  };
  document.querySelectorAll("button.fixbtn").forEach(bx=>bx.onclick=async()=>{
    const key=bx.dataset.key;
    bx.disabled=true; bx.innerHTML=`<span class="spin"></span>`;
    let res=null;
    try{ res=await post(bx.dataset.fix); }
    catch(e){ res={ok:false,error:e.message}; }
    // Success is only claimed when the platform actually reports success, and
    // the message survives the re-check that follows.
    const good = res && res.ok !== false && !res.error;
    S.fixout[key] = {
      cls: good?"good":"bad",
      text: good
        ? (Array.isArray(res.created) ? "created "+res.created.join(", ")
           : res.model ? `${res.model} answers`
           : res.warehouse_id ? `created ${esc(res.name||"warehouse")}, stops after ${res.auto_stop_mins||10} idle minutes`
           : res.started ? "started "+res.started : "done")
        : ((res&&res.human_action) ? res.human_action : "Could not complete."),
      detail: good ? "" : ((res&&res.error) ? "Databricks said: "+res.error : "")
    };
    S.ready = (res && res.readiness) ? res.readiness
            : await j("/api/readiness").catch(()=>S.ready);
    renderStart();
  });
  $("#gobtn").onclick=async(ev)=>{
    const b=ev.currentTarget;
    const stage = S.golog && S.golog.phase==="prepared" ? "process" : "prepare";
    // Feedback first, work second: a click with no visible change reads as a
    // button that did not fire.
    b.disabled=true;
    b.innerHTML=`<span class="spin"></span> ${stage==="process"?"Processing":"Starting"}`;
    const m=$("#gomsg");
    if(m) m.textContent = stage==="process"
      ? "Documents are entering the lanes. Open Flow to watch."
      : "Preparing the workspace. The log appears on the right in a moment.";
    if(stage==="prepare") await saveCfg(true);   // keep the pressed state
    try{ await post("/api/go", {stage}); }
    catch(e){
      b.disabled=false; b.textContent = stage==="process"?"Process documents":"Go";
      if(m) m.textContent=e.message;
      return;
    }
    pollGo();
  };
}
function pollGo(){
  stopPollers();
  poll(async()=>{
    S.golog = await j("/api/golog").catch(()=>S.golog);
    if(S.page==="start"){ const el=$("#golog");
      if(!el && S.golog && S.golog.steps && S.golog.steps.length){
        renderStart();   // first steps arrived: swap the promise for the live log
      } else if(el){ el.innerHTML=renderGolog(); }
      const gb=$("#gobtn"); if(gb){ gb.disabled = S.golog && S.golog.phase==="running";
        gb.textContent = S.golog&&S.golog.phase==="running"?"Running":"Go"; } }
    // Assistants keep provisioning after the run reaches 'prepared', so polling
    // continues while any step is still live — their rows must go green on
    // screen, not silently.
    const live = S.golog && (S.golog.steps||[]).some(x=>x.status==="run");
    if(S.golog && !live &&
       (S.golog.phase==="done"||S.golog.phase==="error"||S.golog.phase==="prepared")){
      stopPollers();
      // Re-render fully so the header stops saying "working" and the button
      // becomes whatever the phase calls for.
      if(S.page==="start"){
        S.ready = await j("/api/readiness").catch(()=>S.ready);
        renderStart();
        const m=$("#gomsg");
        if(m && S.golog.phase==="done")
          m.innerHTML=`Ready in <b class="num">${S.golog.sections["Total, go to ready"]||""}s</b>. Open the Flow page.`;
      }
    }
  }, 2000);
}

}
function docLabels(d){
  // Every chip is a label something actually applied: ai_classify's type in
  // the industry's own words, the sensitivity read, the retention class, and
  // a disagreement flag when the agent and the policy differed.
  const chips=[];
  const t = d.label || d.doc_type;
  if(t) chips.push(`<span class="tag ie" style="font-size:9px">${esc(t)}</span>`);
  if(d.sensitivity) chips.push(`<span class="tag ${d.sensitivity==="sensitive"?"warn":"mut"}" style="font-size:9px">${esc(d.sensitivity)}</span>`);
  if(d.retention_class) chips.push(`<span class="tag sec" style="font-size:9px">${esc(d.retention_class)}</span>`);
  return chips.length? `<div style="display:flex;gap:5px;flex-wrap:wrap">${chips.join("")}</div>` : "—";
}
function laneTag(l){
  const m={ie:["IE","ie"],ka:["KA","ka"],ie_ka:["IE + KA","ie"],secure:["SECURE","sec"],archive:["ARCHIVE","mut"]};
  const t=m[l]||["—","mut"]; return `<span class="tag ${t[1]}" style="font-size:9.5px">${t[0]}</span>`;
}

function loadFlow(){
  stage.innerHTML = `
  <div class="over" id="flowover">Run</div>
  <h1>Documents moving through the bricks</h1>

  <div class="rule"></div>

    <div class="riverwrap" id="river"></div>
    <div class="tickline num" id="tick"></div>
  </div>
  <div class="insp" id="insp" style="display:none"></div>`;
  poll(renderFlow, 2500);
}
async function renderFlow(){
  const g = await j("/api/golog").catch(()=>null); if(!g) return; S.golog=g;
  const st=g.pipeline||{}; const docs=Object.values(st.docs||{});
  const lanes={ie:[],ka:[],ie_ka:[],secure:[],archive:[]};
  docs.forEach(d=>{ if(lanes[d.lane]) lanes[d.lane].push(d); });
  const inFlight = docs.filter(d=>!d.lane).length;
  const running = g.phase==="running" || st.phase && !["done","error","idle","staged"].includes(st.phase);
  const phaseWord = g.phase==="running"?"live":g.phase==="prepared"?"staged":g.phase||"";
  $("#flowover").textContent = `Run ${st.run_id||""} · ${phaseWord}`;
  const pb=$("#procbar");
  if(pb){
    if(g.phase==="prepared" || g.phase==="done"){
      const again = g.phase==="done";
      if(pb.dataset.phase!==g.phase){ pb.dataset.phase=g.phase; pb.innerHTML = `
        <div class="gobar" style="margin-bottom:18px">
          <button class="btn hot" id="procbtn">${again?"Process them again":"Process documents"}</button>
          <span class="msg">${again
            ?"The board clears and every document takes its lane again — faster now, the assistants are already built."
            :"Everything is staged. Press, and watch each document take its lane."}</span>
        </div>`; }
      const b2=$("#procbtn");
      if(b2 && !b2._wired){ b2._wired=true; b2.onclick=async()=>{
        b2.disabled=true; b2.innerHTML=`<span class="spin"></span> Processing`;
        const msg=b2.parentElement && b2.parentElement.querySelector(".msg");
        if(msg) msg.textContent="Documents are entering the lanes.";
        try{ await post("/api/go", {stage:"process"}); }
        catch(e){ b2.disabled=false; b2.textContent=again?"Process them again":"Process documents";
                  if(msg) msg.textContent=e.message; }
      }; }
    } else if(pb.innerHTML){ pb.innerHTML=""; pb.dataset.phase=""; }
  }
  // Structure renders once; polls only touch text and classes. Rebuilding the
  // SVG every poll restarts its animations, which is why nothing ever visibly
  // moved before.
  if(!document.getElementById("riversvg")) buildRiver();
  const set=(id,t)=>{const el=document.getElementById(id); if(el&&el.textContent!==String(t)) el.textContent=t;};
  const onoff=(id,on)=>{const el=document.getElementById(id); if(el) el.classList.toggle("on",!!on);};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dot=(id,show)=>{const el=document.getElementById(id); if(el) el.style.display=(show&&!reduce)?"":"none";};
  // The board animates what the pipeline is doing right now, not the fact that
  // something is running. Each stage names the paths it moves documents along.
  const STAGE_PATHS = {
    ingest:["in"], parse:["in"], label:["in"],
    route:["ie","ka","b1","b2","sec"],
    extract:["ie","b1"], audit:["ie","b1"], secure:["sec"],
  };
  const STAGE_LANES = {
    route:["ie","ka","ie_ka","secure","archive"],
    extract:["ie","ie_ka"], audit:["ie","ie_ka"], secure:["secure"],
  };
  const STAGE_WORD = {
    ingest:"reading the inbox", parse:"ai_parse_document", label:"ai_classify",
    route:"policy picks the lane", extract:"ai_extract", audit:"checking the math",
    secure:"ai_mask + sealing",
  };
  const stage = running ? (st.phase||"") : "";
  const livePaths = new Set(STAGE_PATHS[stage]||[]);
  const liveLanes = new Set(STAGE_LANES[stage]||[]);
  // A lane whose count just grew also flashes, so arrivals are visible even
  // inside a long stage.
  S._prev = S._prev || {};
  const grew = {};
  for(const k of Object.keys(lanes)){
    grew[k] = lanes[k].length > (S._prev[k]||0);
    S._prev[k] = lanes[k].length;
  }
  if(!running) S._prev = {};
  set("c-inbox", docs.length||"·");
  const vp=document.getElementById("f-volpath");
  if(vp&&S.cfg&&S.cfg.catalog){
    const want=`/Volumes/${S.cfg.catalog}/${S.cfg.schema||"docflow"}/docs/inbox`;
    if(vp.textContent!==want) vp.textContent=want;
  }
  const dl=document.getElementById("f-doclist");
  if(dl && S._doclistN!==docs.length){
    S._doclistN=docs.length;
    const rows=docs.slice(0,6).map(d=>
      `<div class="fdrow"><i>PDF</i><em>${esc(d.filename||d.doc_id)}</em></div>`).join("");
    dl.innerHTML=rows+(docs.length>6?`<div class="fdrow" style="color:var(--faint)">+ ${docs.length-6} more</div>`:"");
  }
  set("c-hub", inFlight||docs.length||"·");
  // Exclusive counts on every card: the five badges sum to the inbox, always.
  set("b-ie", `${lanes.ie.length} landed`);
  set("b-ka", `${lanes.ka.length} direct`);
  set("b-both", `${lanes.ie_ka.length} docs`);
  set("b-sec", `${lanes.secure.length} sealed`);
  set("b-arch", `${lanes.archive.length}`);
  // A path is lit when its stage is live; solid-but-quiet once docs have used it.
  const laneOfPath = {in:null, ie:"ie", ka:"ka", b1:"ie_ka", b2:"ie_ka", sec:"secure"};
  for(const pid of ["in","ie","ka","b1","b2","sec"]){
    const ln = laneOfPath[pid];
    const live = livePaths.has(pid) || (ln && grew[ln]);
    const used = ln ? lanes[ln].length > 0 : docs.length > 0;
    const el = document.getElementById("p-"+pid);
    if(el){ el.classList.toggle("on", !!(live||used)); el.classList.toggle("hot", !!live); }
    dot("d-"+pid, live);
  }
  for(const [k,el] of Object.entries({ie:"t-ie",ka:"t-ka",ie_ka:"t-both",secure:"t-sec",archive:"t-arch"})){
    const card = document.getElementById(el);
    if(card) card.classList.toggle("working", liveLanes.has(k));
  }
  const ring = document.querySelector(".ring");
  if(ring) ring.classList.toggle("busy", ["label","route","parse"].includes(stage));
  const sn = document.getElementById("stagenow");
  if(sn) sn.textContent = stage ? (STAGE_WORD[stage]||stage) : "";
  const money = st.money||{};
  const routed = lanes.ie.length+lanes.ka.length+lanes.ie_ka.length+lanes.secure.length+lanes.archive.length;
  const eq = `${lanes.ie.length}+${lanes.ka.length}+${lanes.ie_ka.length}+${lanes.secure.length}+${lanes.archive.length} = ${routed}`;
  const hm = ts => ts?new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
  const when = g.phase==="done"
    ? `<span>started <b>${hm(g.started)}</b></span><span>finished <b>${hm(g.finished)}</b></span>`
      + (g.sections&&g.sections["Total, go to ready"]?`<span>total <b>${g.sections["Total, go to ready"]}s</b></span>`:"")
    : g.phase==="running"
    ? `<span>started <b>${hm(g.started)}</b></span><span>elapsed <b>${st.elapsed_s||Math.max(0,Math.round(Date.now()/1000-(g.started||Date.now()/1000)))}s</b></span>`
    : g.phase==="prepared" ? `<span>staged <b>${hm(g.started?g.started+ (g.steps&&g.steps.length?g.steps[g.steps.length-1].t:0):0)}</b> · waiting for your cue</span>` : "";
  $("#tick").innerHTML = docs.length
    ? `<span>inbox <b class="num">${docs.length}</b></span>
       <span>routed <b class="num">${eq}</b>${inFlight?` <b style="color:var(--faint)">· ${inFlight} in flight</b>`:""}</span>
       <span>caught <b style="color:var(--lava2)">${moneyFmt(money.caught_usd)}</b></span>
       <span>est. cost <b>${money.cost_usd!=null?("$"+money.cost_usd):"—"}</b></span>
       ${when}`
    : g.phase==="prepared"
    ? `<span>24 documents staged · nothing has moved yet · press <b>Process documents</b> above</span>`
    : `<span>Waiting for a run. Press go on the Start page and the river comes alive.</span>`;
  const hero = docs.find(d=>d.why) ;
  if(hero){ $("#insp").style.display="block";
    $("#insp").innerHTML = `
    <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
      <span class="mono" style="font-weight:600">${esc(hero.filename||hero.doc_id)}</span>
      ${laneTag(hero.lane)}
      <span style="margin-left:auto;font:500 10px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase">routing decision record</span></div>
    <div class="kvrow">
      <div class="kv"><div class="k">type</div><div class="v">${esc(hero.doc_type||"")}</div></div>
      <div class="kv"><div class="k">confidence</div><div class="v num">${hero.confidence!=null?Number(hero.confidence).toFixed(2):""}</div></div>
      <div class="kv"><div class="k">sensitivity</div><div class="v">${esc(hero.sensitivity||"")}</div></div>
      <div class="kv"><div class="k">retention</div><div class="v">${esc(hero.retention_class||"")}</div></div>
      <div class="kv"><div class="k">needs extraction</div><div class="v" style="color:var(--ie)">${hero.needs_extraction?"yes":"no"}</div></div>
      <div class="kv"><div class="k">needs q&a</div><div class="v" style="color:var(--ka)">${hero.needs_qa?"yes":"no"}</div></div>
      <div class="kv"><div class="k">lane</div><div class="v">${esc(hero.lane||"")}</div></div>
    </div>
    <div class="pull"><span class="plbl">why it went where it went</span>${esc(hero.why||"")}</div>`; }
}

function routeEdges(){
  const host=$("#river"), svg=$("#riversvg");
  if(!host||!svg) return;
  const H=host.getBoundingClientRect();
  if(!H.width) return;
  svg.setAttribute("viewBox",`0 0 ${H.width} ${H.height}`);
  const mid=(el,side)=>{
    const r=el.getBoundingClientRect();
    return [ (side==="r"?r.right:r.left)-H.left, (r.top+r.bottom)/2-H.top ];
  };
  const set=(id,x0,y0,x1,y1,bend)=>{
    const el=document.getElementById(id); if(!el) return;
    const dx=Math.max(30,(x1-x0)*(bend||0.45));
    el.setAttribute("d",`M${x0},${y0} C${x0+dx},${y0} ${x1-dx},${y1} ${x1},${y1}`);
  };
  const inbox=$("#f-inbox"), lab=$("#f-labeler");
  if(!inbox||!lab) return;
  const [ix,iy]=mid(inbox,"r"), [lx,ly]=mid(lab,"l"), [rx,ry]=mid(lab,"r");
  set("p-in", ix+2, iy, lx-2, ly);
  const tgt={ "p-ie":"t-ie","p-ka":"t-ka","p-sec":"t-sec","p-arch":"t-arch" };
  for(const [pid,tid] of Object.entries(tgt)){
    const band=document.getElementById(tid); if(!band) continue;
    const [bx,by]=mid(band,"l");
    set(pid, rx+2, ry, bx-1, by);
  }
  const both=document.getElementById("t-both");
  if(both){
    const [bx,by]=mid(both,"l");
    set("p-b1", rx+2, ry-3, bx-1, by-3);
    set("p-b2", rx+2, ry+3, bx-1, by+3);
  }
}
const moneyFmt = v => v!=null?("$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0})):"—";
// Cents matter when a customer cross-checks a page against Genie's own total.
const moneyExact = v => v!=null

// Where the numbers on a results page came from, so nobody mistakes an old run
// for a fresh one.
function runProvenance(){
  const g=S.golog||{}, a=g.assets||{};
  if(g.phase==="running") return "A run is in progress. These figures are from the previous run until it finishes.";
  if(a.run_label) return `From ${a.run_label}, in this workspace.`;
  return "From an earlier session in this workspace, not from a run started here.";
}

async function doAsk(){

  S.asking=true; $("#askbtn").disabled=true; $("#askbtn").innerHTML=`<span class="spin"></span>`;

  pathEl.removeAttribute("id");
  const engLabel = isG?"GENIE":(r.engine==="sql"?"GOVERNED SQL":"KNOWLEDGE ASSISTANT");

    ? `${r.route==="tables"?"a question about numbers":"a question about wording"}

       ${r.seconds?`<span>${r.seconds}s</span>`:""}`
    : "";
  let inner="";
  if(r.error) inner=`<div class="aa"><p class="lede">${esc(r.error)}</p></div>`;
  else if(r.pending) inner=`<div class="aa" style="--ac:var(--ka)"><p class="lede">${esc(r.text)}</p>

    ${r.sql?`<div class="code">${esc(r.sql)}</div>`:""}
    ${r.rows&&r.rows.length?`<table style="margin-top:12px">
      ${r.columns&&r.columns.length?`<thead><tr>${r.columns.map(c=>`<th>${esc(c.replace(/_/g," "))}</th>`).join("")}</tr></thead>`:""}
      <tbody>${r.rows.map(row=>

      :`answered by ${esc(r.endpoint||"the assistant")} · Agent Bricks`}</div>

  S.turns.push({html:document.querySelectorAll(".qa")[document.querySelectorAll(".qa").length-1].outerHTML});

}

function bindCase(c){

      const c2=d2&&(d2.cases||[]).find(x=>x.case_id===c.case_id);
      if(c2){ card.outerHTML=renderCase(c2); bindCase(c2);

    }catch(e){ msg.textContent=e.message; b.disabled=false; }

}

      </div>
      <div id="pg-preview" style="margin-top:12px;border:1px dashed var(--hair2);border-radius:14px;
        padding:18px;min-height:220px">${rec&&rec.html?rec.html:`<p class="hint">The page appears here.</p>`}</div>
    </div>
  </div>`;
  S.pageBuild.note="";
  renderThread(rec);
  const inst=$("#pg-inst");
  inst.oninput=()=>{ S.pageBuild.inst=inst.value; };
  inst.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") sendPage(); };
  $("#pg-gen").onclick=sendPage;
  if(working) watchPage(slug);
  renderPrompter("");
}
function renderThread(rec){
  const t=$("#pg-thread"); if(!t) return;
  const working=!!(rec&&rec.job&&rec.job.status==="working");
  const err=rec&&rec.job&&rec.job.status==="error"?rec.job.error:"";
  const rows=[];
  (rec&&rec.chat||[]).forEach(c=>{
    if(c.role==="instruction") rows.push(
      `<div class="snode"><span class="st">›</span>${esc(c.content)}</div>`);
    else rows.push(
      `<div class="hint" style="margin:2px 0 10px 18px">— page updated</div>`);
  });
  if(working) rows.push(
    `<div class="snode"><span class="spin"></span><span class="hint" style="margin-left:8px">writing the page…</span></div>`);
  if(err) rows.push(
    `<div class="snode" style="color:var(--lava)">${esc(err)}</div>`);
  t.innerHTML=rows.join("");
  t.scrollTop=t.scrollHeight;
}
async function sendPage(){
  const inst=$("#pg-inst"), btn=$("#pg-gen"), msg=$("#pg-msg");
  const text=(inst.value||"").trim();
  if(!text){ msg.textContent="Describe the page first."; return; }
  btn.disabled=true; msg.textContent="Starting…";
  const body={instruction:text, slug:S.pageBuild.slug,
    title:($("#pg-title")||{}).value||"", model:$("#pg-model").value};
  let out=null;
  try{ out=await post("/api/pages/generate", body); }catch(e){ out={error:e.message}; }
  if(!out||out.error){ btn.disabled=false; msg.textContent=(out&&out.error)||"That did not work — try again."; return; }
  S.pageBuild={slug:out.slug, inst:""};
  refreshCustomNav();
  loadPageBuilder();
}
function watchPage(slug){
  poll(async()=>{
    if(S.page!=="newpage") return;
    const v=await j("/api/pages/"+encodeURIComponent(slug)).catch(()=>null);
    if(!v) return;
    if(v.job&&v.job.status==="working"){ return; }
    stopPollers(); refreshCustomNav(); loadPageBuilder();
  }, 2500);
}

/* ---------------- presenter prompter ----------------
   A one-line teleprompter for whoever is presenting: the value on screen and
   the next click, written by the run's own research. Dismiss hides it for the
   session; the audience-facing pages stay untouched. */
function renderPrompter(page){
  const old=document.querySelector(".prompter"); if(old) old.remove();
  document.body.dataset.prompter="";
  if(S.prompterOff) return;
  const beats=(S.golog&&S.golog.theme&&S.golog.theme.story)||[];
  const want=page==="recover"?["recover","claims","suppliers"]:[page];
  const beat=beats.find(b=>b&&want.includes(b.page));
  if(!beat||!beat.line) return;
  const el=document.createElement("div");
  el.className="prompter";
  el.innerHTML=`<span class="plab">Story</span>
    <span class="pline">${esc(beat.line)}</span>
    <span class="pcue">next · <b>${esc(beat.cue||"")}</b></span>
    <button class="px" title="Hide for this session">×</button>`;
  el.querySelector(".px").onclick=()=>{ S.prompterOff=true; el.remove();
    document.body.dataset.prompter=""; };
  document.body.appendChild(el);
  document.body.dataset.prompter="1";
}

/* ---------------- router ---------------- */
const LOADERS={start:loadStart,docs:loadDocs,flow:loadFlow,ask:loadAsk,recover:loadRecover,built:loadBuilt,newpage:loadPageBuilder};
async function go(page, push){
  if(page && page.startsWith("p-")){ return goCustom(page.slice(2), push); }
  if(page==="claims"||page==="suppliers") page="recover";
  if(!LOADERS[page]) page="start";
  stopPollers(); S.page=page;
  if(push!==false && location.hash.slice(1)!==page) location.hash=page;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===page));
  stage.innerHTML=`<div class="empty"><span class="spin"></span></div>`;
  try{ if(!S.golog) S.golog=await j("/api/golog").catch(()=>null); await LOADERS[page](); }
  catch(e){ stage.innerHTML=`<div class="empty"><b>This page could not load</b>${esc(e.message)}</div>`; }
  renderPrompter(page);
  if(page==="start" && S.golog && S.golog.phase==="running") pollGo();
  document.body.dataset.ready="1";
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
refreshCustomNav();
window.addEventListener("hashchange",()=>{ const p=location.hash.slice(1);
  if(p && p!==S.page) go(p,false); });
go(location.hash.slice(1)||"start", false);
</script>
</body>
